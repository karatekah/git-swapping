name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test profiles and failure paths
        shell: powershell
        run: ./tests/git-profile.Tests.ps1
  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test profiles and failure paths
        shell: pwsh
        run: ./tests/git-profile.Tests.ps1
